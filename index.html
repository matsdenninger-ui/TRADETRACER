/* WebGL2: Liquid-Metal-Logo (Portierung aus liquid-logo)                  */
/* ---------------------------------------------------------------------- */

const LIQUID_VERT = `#version 300 es
precision mediump float;
in vec2 a_position;
out vec2 vUv;
void main() { vUv = .5 * (a_position + 1.); gl_Position = vec4(a_position, 0.0, 1.0); }`;

const LIQUID_FRAG = `#version 300 es
precision mediump float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D u_image_texture;
uniform float u_time;
uniform float u_patternScale;
uniform float u_refraction;
uniform float u_edge;
uniform float u_patternBlur;
uniform float u_liquid;
uniform vec3 u_tint;
#define PI 3.14159265358979323846

vec3 mod289(vec3 x) { return x - floor(x * (1. / 289.)) * 289.; }
vec2 mod289(vec2 x) { return x - floor(x * (1. / 289.)) * 289.; }
vec3 permute(vec3 x) { return mod289(((x*34.)+1.)*x); }
float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1., 0.) : vec2(0., 1.);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0., i1.y, 1.)) + i.x + vec3(0., i1.x, 1.));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.);
  m = m*m; m = m*m;
  vec3 x = 2. * fract(p * C.www) - 1.;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130. * dot(m, g);
}
vec2 rotate(vec2 uv, float th) { return mat2(cos(th), sin(th), -sin(th), cos(th)) * uv; }
float get_color_channel(float c1, float c2, float stripe_p, vec3 w, float extra_blur, float b) {
  float ch = c2;
  float border = 0.;
  float blur = u_patternBlur + extra_blur;
  ch = mix(ch, c1, smoothstep(.0, blur, stripe_p));
  border = w[0];
  ch = mix(ch, c2, smoothstep(border - blur, border + blur, stripe_p));
  b = smoothstep(.2, .8, b);
  border = w[0] + .4 * (1. - b) * w[1];
  ch = mix(ch, c1, smoothstep(border - blur, border + blur, stripe_p));
  border = w[0] + .5 * (1. - b) * w[1];
  ch = mix(ch, c2, smoothstep(border - blur, border + blur, stripe_p));
  border = w[0] + w[1];
  ch = mix(ch, c1, smoothstep(border - blur, border + blur, stripe_p));
  float gradient_t = (stripe_p - w[0] - w[1]) / w[2];
  float gradient = mix(c1, c2, smoothstep(0., 1., gradient_t));
  ch = mix(ch, gradient, smoothstep(border - blur, border + blur, stripe_p));
  return ch;
}
void main() {
  vec2 uv = vUv;
  uv.y = 1. - uv.y;
  float diagonal = uv.x - uv.y;
  float t = .001 * u_time;
  vec2 img_uv = vUv; img_uv.y = 1. - img_uv.y;
  vec4 img = texture(u_image_texture, img_uv);
  vec3 color1 = vec3(.98, 0.98, 1.);
  vec3 color2 = vec3(.1, .1, .1 + .1 * smoothstep(.7, 1.3, uv.x + uv.y));
  float edge = img.r;
  vec2 grad_uv = uv - .5;
  float dist = length(grad_uv + vec2(0., .2 * diagonal));
  grad_uv = rotate(grad_uv, (.25 - .2 * diagonal) * PI);
  float bulge = pow(1.8 * dist, 1.2);
  bulge = 1. - bulge;
  bulge *= pow(uv.y, .3);
  float cycle_width = u_patternScale;
  float thin_strip_1_ratio = .12 / cycle_width * (1. - .4 * bulge);
  float thin_strip_2_ratio = .07 / cycle_width * (1. + .4 * bulge);
  float wide_strip_ratio = (1. - thin_strip_1_ratio - thin_strip_2_ratio);
  float thin_strip_1_width = cycle_width * thin_strip_1_ratio;
  float thin_strip_2_width = cycle_width * thin_strip_2_ratio;
  float opacity = 1. - smoothstep(.9 - .5 * u_edge, 1. - .5 * u_edge, edge);
  float noise = snoise(uv - t);
  edge += (1. - edge) * u_liquid * noise;
  float refr = clamp(1. - bulge, 0., 1.);
  float dir = grad_uv.x + diagonal;
  dir -= 2. * noise * diagonal * (smoothstep(0., 1., edge) * smoothstep(1., 0., edge));
  bulge *= clamp(pow(uv.y, .1), .3, 1.);
  dir *= (.1 + (1.1 - edge) * bulge);
  dir *= smoothstep(1., .7, edge);
  dir += .18 * (smoothstep(.1, .2, uv.y) * smoothstep(.4, .2, uv.y));
  dir += .03 * (smoothstep(.1, .2, 1. - uv.y) * smoothstep(.4, .2, 1. - uv.y));
  dir *= (.5 + .5 * pow(uv.y, 2.));
  dir *= cycle_width;
  dir -= t;
  float refr_r = refr + .03 * bulge * noise;
  float refr_b = 1.3 * refr;
  refr_r += 5. * (smoothstep(-.1, .2, uv.y) * smoothstep(.5, .1, uv.y)) * (smoothstep(.4, .6, bulge) * smoothstep(1., .4, bulge));
  refr_r -= diagonal;
  refr_b += (smoothstep(0., .4, uv.y) * smoothstep(.8, .1, uv.y)) * (smoothstep(.4, .6, bulge) * smoothstep(.8, .4, bulge));
  refr_b -= .2 * edge;
  refr_r *= u_refraction;
  refr_b *= u_refraction;
  vec3 w = vec3(thin_strip_1_width, thin_strip_2_width, wide_strip_ratio);
  w[1] -= .02 * smoothstep(.0, 1., edge + bulge);
  float r = get_color_channel(color1.r, color2.r, mod(dir + refr_r, 1.), w, 0.02 + .03 * u_refraction * bulge, bulge);
  float g = get_color_channel(color1.g, color2.g, mod(dir, 1.), w, 0.01 / (1. - diagonal), bulge);
  float b = get_color_channel(color1.b, color2.b, mod(dir - refr_b, 1.), w, .01, bulge);
  vec3 color = vec3(r, g, b);
  // Akzentfarbe einmischen (Gold-/Farbton des Themes)
  color = mix(color, color * u_tint * 1.35, 0.55);
  fragColor = vec4(color * opacity, opacity);
}`;

/* Erzeugt die "Bevel"-Kantenkarte des Logos per Poisson-Loesung (wie parse-logo-image.ts) */
function buildLogoEdgeMap(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = '#000'; ctx.lineWidth = size * 0.15; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const s = size / 32;
  ctx.beginPath();
  ctx.moveTo(6 * s, 23 * s); ctx.lineTo(13 * s, 15.5 * s); ctx.lineTo(18 * s, 19.5 * s); ctx.lineTo(26 * s, 9 * s);
  ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.moveTo(27.8 * s, 5.2 * s); ctx.lineTo(28.4 * s, 13.8 * s); ctx.lineTo(20.6 * s, 8.4 * s); ctx.closePath(); ctx.fill();
  const data = ctx.getImageData(0, 0, size, size).data;
  const N = size * size;
  const mask = new Uint8Array(N);
  for (let i = 0; i < N; i++) mask[i] = data[i * 4] < 128 ? 1 : 0;
  const inside = (x, y) => x >= 0 && y >= 0 && x < size && y < size && mask[y * size + x] === 1;
  const boundary = new Uint8Array(N);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = y * size + x;
    if (!mask[i]) continue;
    if (!inside(x + 1, y) || !inside(x - 1, y) || !inside(x, y + 1) || !inside(x, y - 1)) boundary[i] = 1;
  }
  let u = new Float32Array(N), nu = new Float32Array(N);
  for (let iter = 0; iter < 160; iter++) {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const i = y * size + x;
      if (!mask[i] || boundary[i]) { nu[i] = 0; continue; }
      nu[i] = (0.01 + u[i + 1] + u[i - 1] + u[i + size] + u[i - size]) / 4;
    }
    const tmp = u; u = nu; nu = tmp;
  }
  let maxV = 0;
  for (let i = 0; i < N; i++) if (u[i] > maxV) maxV = u[i];
  const out = new Uint8Array(N * 4);
  for (let i = 0; i < N; i++) {
    const g = mask[i] ? 255 * (1 - Math.pow(u[i] / (maxV || 1), 2)) : 255;
    out[i * 4] = out[i * 4 + 1] = out[i * 4 + 2] = g; out[i * 4 + 3] = 255;
  }
  return { size, data: out };
}

let LOGO_EDGE_MAP = null;

function LiquidLogo({ hue }) {
  const canvasRef = useRef(null);
  const [failed, setFailed] = useState(false);
  const hueRef = useRef(hue);
  hueRef.current = hue;

  useEffect(() => {
    const canvas = canvasRef.current;
    const gl = canvas && canvas.getContext('webgl2', { premultipliedAlpha: true, alpha: true });
    if (!gl) { setFailed(true); return; }
    const program = createProgram(gl, LIQUID_VERT, LIQUID_FRAG);
    if (!program) { setFailed(true); return; }
    gl.useProgram(program);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = (n) => gl.getUniformLocation(program, n);
    gl.uniform1f(U('u_patternScale'), 2);
    gl.uniform1f(U('u_refraction'), 0.015);
    gl.uniform1f(U('u_edge'), 0.4);
    gl.uniform1f(U('u_patternBlur'), 0.005);
    gl.uniform1f(U('u_liquid'), 0.07);
    const uTime = U('u_time'), uTint = U('u_tint');

    if (!LOGO_EDGE_MAP) LOGO_EDGE_MAP = buildLogoEdgeMap(128);
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, LOGO_EDGE_MAP.size, LOGO_EDGE_MAP.size, 0, gl.RGBA, gl.UNSIGNED_BYTE, LOGO_EDGE_MAP.data);
    gl.uniform1i(U('u_image_texture'), 0);

    const px = Math.round(42 * Math.min(2, window.devicePixelRatio || 1) * 1.5);
    canvas.width = canvas.height = px;
    gl.viewport(0, 0, px, px);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let raf = 0, total = 4000, prev = performance.now();
    const render = (now) => {
      total += (now - prev) * (reduced ? 0 : 0.3); prev = now;
      const [r, g, b] = hslToRgb(hueRef.current, 85, 68);
      gl.uniform3f(uTint, r, g, b);
      gl.uniform1f(uTime, total);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      raf = requestAnimationFrame(render);
    };
    raf = requestAnimationFrame(render);
    return () => cancelAnimationFrame(raf);
  }, []);

  return (
    <div className="brand-mark">
      {failed
        ? <div className="brand-fallback"><Icon name="TrendingUp" size={22} strokeWidth={2.6} /></div>
        : <canvas ref={canvasRef} aria-label="TradeTracer Logo" />}
    </div>
  );
}

/* Smart-Coach: regelbasierte Auswertung deiner Daten                      */

const INSIGHT_MIN_TRADES = 10;

function computeInsights(trades, stats, mindset, plan, currency) {
  if (trades.length < INSIGHT_MIN_TRADES) return [];
  const out = [];
  const overallAvg = stats.expectancy;
  const push = (tone, icon, title, text, metric, weight) => out.push({ tone, icon, title, text, metric, weight: Math.abs(weight || 0) });

  // 1) Wochentag
  const wd = Object.entries(groupBy(trades, t => weekdayOf(t.date))).map(([n, l]) => rowStats(n, l)).filter(r => r.count >= 3);
  if (wd.length >= 2) {
    const best = [...wd].sort((a, b) => b.avg - a.avg)[0];
    const worst = [...wd].sort((a, b) => a.avg - b.avg)[0];
    if (best.avg > 0) push('good', 'Calendar', `${best.name} ist dein stärkster Tag`, `Ø ${fmtMoney(best.avg, currency)} pro Trade bei ${fmtPct(best.winRate, 0)} Trefferquote (${best.count} Trades).`, fmtMoneySigned(best.pnl, currency), best.pnl);
    if (worst.avg < 0 && worst.name !== best.name) push('bad', 'Calendar', `${worst.name} kostet dich Geld`, `Ø ${fmtMoney(worst.avg, currency)} pro Trade. Überlege, an diesem Tag kleiner oder gar nicht zu handeln.`, fmtMoneySigned(worst.pnl, currency), worst.pnl);
  }

  // 2) Tageszeit
  const timed = trades.filter(t => t.time);
  const hb = Object.entries(groupBy(timed, t => hourBucketOf(t.time))).map(([n, l]) => rowStats(n, l)).filter(r => r.count >= 3);
  if (hb.length >= 2) {
    const best = [...hb].sort((a, b) => b.avg - a.avg)[0];
    const worst = [...hb].sort((a, b) => a.avg - b.avg)[0];
    if (best.avg > 0) push('good', 'Clock', `Deine beste Zeit: ${best.name.split(' (')[0]}`, `${best.name}: Ø ${fmtMoney(best.avg, currency)} pro Trade, ${fmtPct(best.winRate, 0)} Treffer.`, fmtMoneySigned(best.pnl, currency), best.pnl * 0.9);
    if (worst.avg < 0 && worst.name !== best.name) push('bad', 'Clock', `Schwache Phase: ${worst.name.split(' (')[0]}`, `${worst.name} bringt dir Ø ${fmtMoney(worst.avg, currency)} pro Trade.`, fmtMoneySigned(worst.pnl, currency), worst.pnl * 0.9);
  }

  // 3) Strategien
  const st = Object.entries(groupBy(trades.filter(t => t.strategy), t => t.strategy)).map(([n, l]) => rowStats(n, l)).filter(r => r.count >= 3);
  if (st.length >= 1) {
    const best = [...st].sort((a, b) => b.pnl - a.pnl)[0];
    const worst = [...st].sort((a, b) => a.pnl - b.pnl)[0];
    if (best.pnl > 0) push('good', 'Zap', `Dein Edge: ${best.name}`, `${best.count} Trades, ${fmtPct(best.winRate, 0)} Trefferquote. Diese Strategie trägt dein Konto – mehr davon.`, fmtMoneySigned(best.pnl, currency), best.pnl * 1.1);
    if (worst.pnl < 0 && worst.name !== best.name) push('bad', 'Zap', `${worst.name} funktioniert (noch) nicht`, `${worst.count} Trades mit ${fmtPct(worst.winRate, 0)} Trefferquote. Setup überarbeiten oder pausieren.`, fmtMoneySigned(worst.pnl, currency), worst.pnl * 1.1);
  }

  // 4) Long vs. Short
  const longs = trades.filter(t => t.direction === 'long'), shorts = trades.filter(t => t.direction === 'short');
  if (longs.length >= 3 && shorts.length >= 3) {
    const L = rowStats('Long', longs), S = rowStats('Short', shorts);
    const better = L.avg >= S.avg ? L : S, worse = L.avg >= S.avg ? S : L;
    if (worse.pnl < 0 || better.avg > worse.avg * 2) push(worse.pnl < 0 ? 'bad' : 'info', 'ArrowLeftRight', `Du bist ein besserer ${better.name}-Trader`, `${better.name}: Ø ${fmtMoney(better.avg, currency)} · ${worse.name}: Ø ${fmtMoney(worse.avg, currency)} pro Trade.`, `${fmtPct(better.winRate, 0)} vs. ${fmtPct(worse.winRate, 0)}`, Math.abs(better.pnl - worse.pnl) * 0.5);
  }

  // 5) Planabweichungen
  const off = trades.filter(t => t.onPlan === false);
  if (off.length >= 2) {
    const offPnl = sum(off.map(calcPnL));
    const onAvg = mean(trades.filter(t => t.onPlan !== false).map(calcPnL));
    if (offPnl < 0) push('bad', 'Compass', 'Trades außerhalb deines Plans kosten dich', `${off.length} Trades ohne Plan brachten ${fmtMoney(offPnl, currency)}. Trades im Plan: Ø ${fmtMoney(onAvg, currency)}.`, fmtMoneySigned(offPnl, currency), offPnl * 1.3);
    else push('info', 'Compass', 'Improvisation lief bisher gut – Vorsicht', `${off.length} Trades außerhalb des Plans waren zusammen positiv. Prüfe, ob das Glück oder ein neues Setup ist.`, fmtMoneySigned(offPnl, currency), offPnl * 0.3);
  }

  // 6) Stop-Loss-Nutzung
  if (stats.slUsage < 60) push('bad', 'Shield', 'Zu wenige Trades mit Stop-Loss', `Nur ${fmtPct(stats.slUsage, 0)} deiner Trades haben einen Stop. Ohne Stop kein R-Multiple und kein kontrolliertes Risiko.`, fmtPct(stats.slUsage, 0), Math.abs(stats.avgLoss) * 3);
  else if (stats.slUsage >= 90) push('good', 'Shield', 'Starkes Risikomanagement', `${fmtPct(stats.slUsage, 0)} deiner Trades sind mit Stop-Loss abgesichert.`, fmtPct(stats.slUsage, 0), stats.avgWin);

  // 7) Rache-Trades (Trade direkt nach einem Verlust am selben Tag)
  const sorted = stats.sorted;
  const afterLoss = [];
  for (let i = 1; i < sorted.length; i++) if (sorted[i].date === sorted[i - 1].date && stats.pnls[i - 1] < 0) afterLoss.push(stats.pnls[i]);
  if (afterLoss.length >= 3) {
    const avgAfter = mean(afterLoss);
    if (avgAfter < overallAvg && avgAfter < 0) push('bad', 'Flame', 'Nach Verlusten tradest du schlechter', `Trades direkt nach einem Verlust am selben Tag: Ø ${fmtMoney(avgAfter, currency)} (sonst Ø ${fmtMoney(overallAvg, currency)}). Nach einem Verlust: Pause.`, fmtMoneySigned(sum(afterLoss), currency), sum(afterLoss));
  }

  // 8) Overtrading
  if (plan.maxTradesPerDay) {
    const perDay = groupBy(trades, t => t.date);
    const overDays = Object.values(perDay).filter(l => l.length > plan.maxTradesPerDay);
    if (overDays.length >= 1) {
      const pnl = sum(overDays.flat().map(calcPnL));
      push(pnl < 0 ? 'bad' : 'info', 'Repeat', `Tageslimit ${overDays.length}× überschritten`, `An Tagen mit mehr als ${plan.maxTradesPerDay} Trades lag dein Ergebnis bei ${fmtMoney(pnl, currency)}.`, fmtMoneySigned(pnl, currency), pnl);
    }
  }

  // 9) Haltedauer
  if (stats.avgWinHold != null && stats.avgLossHold != null && stats.avgWinHold > 0) {
    const ratio = stats.avgLossHold / stats.avgWinHold;
    if (ratio > 1.3) push('bad', 'Clock', `Du hältst Verlierer ${fmtNum(ratio, 1)}× länger`, `Gewinner: Ø ${fmtDuration(stats.avgWinHold)} · Verlierer: Ø ${fmtDuration(stats.avgLossHold)}. Klassisches "Hoffen" – schneller raus.`, `${fmtNum(ratio, 1)}×`, Math.abs(stats.avgLoss) * 2);
    else if (ratio < 0.8) push('good', 'Clock', 'Du schneidest Verluste schnell ab', `Verlierer hältst du Ø ${fmtDuration(stats.avgLossHold)}, Gewinner Ø ${fmtDuration(stats.avgWinHold)}. Genau so.`, `${fmtNum(ratio, 1)}×`, stats.avgWin);
  }

  // 10) Payoff vs. Trefferquote
  if (stats.wins && stats.losses && Number.isFinite(stats.payoff)) {
    const breakeven = 100 / (1 + stats.payoff);
    const edge = stats.winRate - breakeven;
    push(edge >= 0 ? 'good' : 'bad', 'Target', edge >= 0 ? 'Deine Mathematik stimmt' : 'Deine Mathematik stimmt noch nicht',
      `Gewinn/Verlust-Verhältnis ${fmtNum(stats.payoff, 2)} → Break-even ab ${fmtPct(breakeven, 0)} Trefferquote. Du liegst bei ${fmtPct(stats.winRate, 0)}.`,
      `${edge >= 0 ? '+' : ''}${fmtNum(edge, 1)} Pp.`, Math.abs(stats.totalPnL) * 0.8);
  }

  // 11) Emotion beim Einstieg
  const em = Object.entries(groupBy(trades.filter(t => t.emotion), t => t.emotion)).map(([k, l]) => ({ key: k, ...rowStats(k, l) })).filter(r => r.count >= 2);
  if (em.length) {
    const worst = [...em].sort((a, b) => a.pnl - b.pnl)[0];
    const best = [...em].sort((a, b) => b.pnl - a.pnl)[0];
    if (worst.pnl < 0) { const e = EMOTION_BY_KEY[worst.key]; push('bad', 'Smile', `${e?.emoji || ''} ${e?.label || worst.key} ist teuer`, `Trades mit dieser Emotion: ${worst.count} Stück, ${fmtMoney(worst.pnl, currency)} gesamt. Erkenne das Gefühl – und bleib draußen.`, fmtMoneySigned(worst.pnl, currency), worst.pnl * 1.2); }
    if (best.pnl > 0 && best.key !== worst.key) { const e = EMOTION_BY_KEY[best.key]; push('good', 'Smile', `${e?.emoji || ''} ${e?.label || best.key} bringt dir Geld`, `${best.count} Trades mit ${fmtPct(best.winRate, 0)} Trefferquote. Das ist dein idealer Zustand.`, fmtMoneySigned(best.pnl, currency), best.pnl); }
  }

  // 12) Fehler-Trades
  const mistakes = trades.filter(t => t.result === 'mistake');
  if (mistakes.length >= 2) {
    const pnl = sum(mistakes.map(calcPnL));
    if (pnl < 0) push('bad', 'AlertTriangle', 'Vermeidbare Fehler', `${mistakes.length} als Fehler markierte Trades kosteten ${fmtMoney(pnl, currency)} – ohne sie läge dein Ergebnis bei ${fmtMoney(stats.totalPnL - pnl, currency)}.`, fmtMoneySigned(pnl, currency), pnl * 1.2);
  }

  // 13) Gebühren
  if (stats.grossWin > 0 && stats.totalFees / stats.grossWin > 0.12) push('bad', 'Percent', 'Gebühren fressen deinen Gewinn', `${fmtPct((stats.totalFees / stats.grossWin) * 100, 0)} deiner Bruttogewinne gehen an Gebühren (${fmtMoney(stats.totalFees, currency)}).`, fmtMoney(-stats.totalFees, currency), stats.totalFees);

  // 14) Verlustserie
  if (stats.maxLossStreak >= 4) push('info', 'TrendingDown', `Längste Verlustserie: ${stats.maxLossStreak} Trades`, 'Plane eine feste Regel: nach 3 Verlusten in Folge ist der Tag beendet.', `${stats.maxLossStreak}×`, Math.abs(stats.avgLoss) * stats.maxLossStreak * 0.5);

  // 15) Symbole
  const sy = Object.entries(groupBy(trades, t => t.symbol)).map(([n, l]) => rowStats(n, l)).filter(r => r.count >= 3);
  if (sy.length >= 2) {
    const worst = [...sy].sort((a, b) => a.pnl - b.pnl)[0];
    if (worst.pnl < 0) push('bad', 'Crosshair', `${worst.name} liegt dir nicht`, `${worst.count} Trades, ${fmtPct(worst.winRate, 0)} Trefferquote. Streiche es von der Watchlist oder handle es kleiner.`, fmtMoneySigned(worst.pnl, currency), worst.pnl * 0.8);
  }

  // 16) Stimmung vor der Session
  const dayTotals = stats.dayPnls;
  const moodGroups = {};
  Object.entries(dayTotals).forEach(([date, pnl]) => { const m = mindset?.[date]?.pre; if (m?.done && m.mood) (moodGroups[m.mood] = moodGroups[m.mood] || []).push(pnl); });
  const moodRows = Object.entries(moodGroups).filter(([, l]) => l.length >= 2).map(([k, l]) => ({ k, avg: mean(l), n: l.length }));
  if (moodRows.length >= 2) {
    const worst = [...moodRows].sort((a, b) => a.avg - b.avg)[0];
    const mood = PRE_MOODS.find(m => m.key === worst.k);
    if (worst.avg < 0) push('bad', 'Brain', `An "${mood?.label}"-Tagen verlierst du`, `${mood?.emoji} ${worst.n} Tage mit Ø ${fmtMoney(worst.avg, currency)}. Wenn du dich so fühlst: nur halbe Positionsgröße.`, fmtMoneySigned(worst.avg * worst.n, currency), worst.avg * worst.n);
  }

  return out.sort((a, b) => b.weight - a.weight);
}

/* Trader-Score: 6 Dimensionen, je 0–100 */
function computeTraderScore(trades, stats) {
  if (!trades.length) return null;
  const onPlanPct = (trades.filter(t => t.onPlan !== false).length / trades.length) * 100;
  const pf = stats.profitFactor === Infinity ? 3 : stats.profitFactor;
  const greenDayPct = stats.tradingDays ? (stats.greenDays / stats.tradingDays) * 100 : 0;
  const recovery = stats.recoveryFactor == null ? (stats.totalPnL > 0 ? 3 : 0) : stats.recoveryFactor;
  const ddPenalty = clamp(Math.abs(stats.maxDrawdownPct) * 3, 0, 60);
  const axes = [
    { key: 'win', label: 'Trefferquote', value: clamp((stats.winRate / 65) * 100, 0, 100) },
    { key: 'pf', label: 'Profitfaktor', value: clamp((pf / 2.5) * 100, 0, 100) },
    { key: 'risk', label: 'Risikomanagement', value: clamp(stats.slUsage * 0.7 + (60 - ddPenalty) * 0.5, 0, 100) },
    { key: 'disc', label: 'Disziplin', value: clamp(onPlanPct, 0, 100) },
    { key: 'cons', label: 'Konstanz', value: clamp((greenDayPct / 70) * 100, 0, 100) },
    { key: 'rec', label: 'Erholung', value: clamp((recovery / 3) * 100, 0, 100) }
  ];
  const total = Math.round(mean(axes.map(a => a.value)));
  const grade = total >= 85 ? 'Elite' : total >= 70 ? 'Profi' : total >= 55 ? 'Fortgeschritten' : total >= 40 ? 'Auf dem Weg' : 'Einsteiger';
  return { axes, total, grade };
}

function journalStreak(mindset) {
  let streak = 0;
  let d = todayISO();
  const done = (iso) => mindset?.[iso]?.pre?.done || mindset?.[iso]?.post?.done;
  if (!done(d)) d = addDaysISO(d, -1);
  while (done(d)) { streak++; d = addDaysISO(d, -1); }
  return streak;
}

function CircularProgress({ percent, size = 100, stroke = 9, color = 'var(--accent)', label }) {
  const clamped = Math.max(0, Math.min(100, percent));
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (clamped / 100) * c;
  const gid = useMemo(() => `ring-${Math.random().toString(36).slice(2, 8)}`, []);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="1" />
          <stop offset="100%" stopColor={color} stopOpacity="0.55" />
        </linearGradient>
      </defs>
      <circle cx={size / 2} cy={size / 2} r={r} stroke="rgba(255,255,255,0.07)" strokeWidth={stroke} fill="none" />
      <circle
        cx={size / 2} cy={size / 2} r={r} stroke={`url(#${gid})`} strokeWidth={stroke} fill="none"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: 'stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)', filter: `drop-shadow(0 0 6px ${color})` }}
      />
      <text x="50%" y="50%" textAnchor="middle" dy="0.35em" fill="var(--text)" fontSize={size * 0.2} fontFamily="'Space Grotesk', sans-serif" fontWeight="600">
        {label ?? `${Math.round(clamped)}%`}
      </text>
    </svg>
  );
}

/* Interaktives Flächendiagramm mit Hover-Tooltip */
function AreaChart({ data, valueKey, color, height = 140, currency = '$', showTip = true }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  if (!data || data.length === 0) return null;
  const width = 600;
  const values = data.map(d => d[valueKey]);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const pad = (max - min) * 0.12 || Math.abs(max) * 0.05 || 1;
  const lo = valueKey === 'drawdown' ? min - pad : min - pad;
  const hi = valueKey === 'drawdown' ? 0 : max + pad;
  const range = hi - lo || 1;
  const stepX = data.length > 1 ? width / (data.length - 1) : width;
  const pts = data.map((d, i) => [data.length > 1 ? i * stepX : width / 2, height - ((d[valueKey] - lo) / range) * height]);
  const line = pts.map((p, i) => {
    if (i === 0) return `M ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    const prev = pts[i - 1];
    const cx = (prev[0] + p[0]) / 2;
    return `C ${cx.toFixed(1)} ${prev[1].toFixed(1)} ${cx.toFixed(1)} ${p[1].toFixed(1)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  }).join(' ');
  const baseY = valueKey === 'drawdown' ? 0 : height;
  const area = `${line} L ${pts[pts.length - 1][0].toFixed(1)} ${baseY} L ${pts[0][0].toFixed(1)} ${baseY} Z`;
  const gradId = `grad-${valueKey}-${color.replace(/[^a-z0-9]/gi, '')}`;

  const onMove = (e) => {
    const rect = wrapRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * width;
    const idx = clamp(Math.round(x / (stepX || 1)), 0, data.length - 1);
    setHover(idx);
  };
  const hp = hover != null ? pts[hover] : null;

  return (
    <div className="chart-wrap" ref={wrapRef} onMouseMove={showTip ? onMove : undefined} onMouseLeave={() => setHover(null)}>
      <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block', overflow: 'visible' }}>
        <defs>
          <linearGradient id={gradId} x1="0" y1={valueKey === 'drawdown' ? '1' : '0'} x2="0" y2={valueKey === 'drawdown' ? '0' : '1'}>
            <stop offset="0%" stopColor={color} stopOpacity="0.38" />
            <stop offset="100%" stopColor={color} stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={area} fill={`url(#${gradId})`} stroke="none" />
        <path d={line} fill="none" stroke={color} strokeWidth="2.2" vectorEffect="non-scaling-stroke" style={{ filter: `drop-shadow(0 0 5px ${color}66)` }} />
        {hp && <line x1={hp[0]} x2={hp[0]} y1="0" y2={height} stroke="rgba(255,255,255,0.18)" strokeDasharray="3 3" vectorEffect="non-scaling-stroke" />}
      </svg>
      {hp && (
        <>
          <div style={{ position: 'absolute', left: `${(hp[0] / width) * 100}%`, top: hp[1], width: 10, height: 10, marginLeft: -5, marginTop: -5, borderRadius: '50%', background: color, boxShadow: `0 0 0 3px rgba(0,0,0,0.4), 0 0 12px ${color}`, pointerEvents: 'none' }} />
          <div className="chart-tip glass-strong" style={{ left: `${clamp((hp[0] / width) * 100, 8, 92)}%`, top: -8 }}>
            <div className="tt-date">{data[hover].label ? `${data[hover].label} · ` : ''}{fmtDateShort(data[hover].date)}</div>
            <div className="tt-val" style={{ color }}>{fmtMoney(data[hover][valueKey], currency)}</div>
          </div>
        </>
      )}
    </div>
  );
}

/* Radar-Diagramm für den Trader-Score */
function RadarChart({ axes, size = 260 }) {
  const cx = size / 2, cy = size / 2, R = size / 2 - 58;
  const n = axes.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + (i / n) * Math.PI * 2; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
  const poly = axes.map((a, i) => pt(i, a.value / 100).join(',')).join(' ');
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="radar">
      <defs>
        <radialGradient id="radar-fill" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.15" />
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0.45" />
        </radialGradient>
      </defs>
      {[0.25, 0.5, 0.75, 1].map(l => (
        <polygon key={l} points={axes.map((_, i) => pt(i, l).join(',')).join(' ')} fill="none" stroke="rgba(255,255,255,0.08)" />
      ))}
      {axes.map((_, i) => { const [x, y] = pt(i, 1); return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="rgba(255,255,255,0.06)" />; })}
      <polygon points={poly} fill="url(#radar-fill)" stroke="var(--accent)" strokeWidth="2" strokeLinejoin="round" style={{ filter: 'drop-shadow(0 0 10px hsl(var(--accent-h) 80% 55% / .5))' }} />
      {axes.map((a, i) => { const [x, y] = pt(i, a.value / 100); return <circle key={a.key} cx={x} cy={y} r="3.5" fill="#fff" stroke="var(--accent)" strokeWidth="2" />; })}
      {axes.map((a, i) => {
        const [x, y] = pt(i, 1.2);
        return (
          <text key={a.key} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fill="var(--text-muted)" fontSize="10.5" fontFamily="Inter, sans-serif">
            <tspan x={x} dy="-0.4em">{a.label}</tspan>
            <tspan x={x} dy="1.25em" fill="var(--text)" fontWeight="600" fontFamily="'IBM Plex Mono', monospace">{Math.round(a.value)}</tspan>
          </text>
        );
      })}
    </svg>
  );
}

  const [draft, setDraft] = useState('');
  const add = () => {
    if (!draft.trim()) return;
    onChange([...rules, draft.trim()]);
    setDraft('');
  };
  const remove = (idx) => onChange(rules.filter((_, i) => i !== idx));
  return (
    <div className="rule-list">
      {rules.map((r, i) => (
        <div key={i} className="rule-item">
          <span className="rule-dot" />
          <span className="rule-text">{r}</span>
          <button className="rule-remove" onClick={() => remove(i)} aria-label="Regel entfernen"><Icon name="X" size={13} /></button>
        </div>
      ))}
      <div className="rule-add">
        <Icon name="Plus" size={14} />
        <input value={draft} placeholder={placeholder} onChange={e => setDraft(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); add(); } }} />
      </div>
    </div>
  );
}

    <div className="chip-editor">
      {tags.length > 0 && (
        <div className="chip-row">
          {tags.map(t => (
            <span key={t} className="chip removable">

      <div className="chip-add">

          {o.emoji ? `${o.emoji} ` : ''}{o.label}
        </button>
      ))}
    </div>
  );
}

/* Liquid-Glass-Tab-Leiste mit gleitendem Indikator */
function TabNav({ tabs, active, onChange }) {
  const navRef = useRef(null);
  const btnRefs = useRef({});
  const [ind, setInd] = useState({ x: 0, w: 0, ready: false });

  const measure = useCallback(() => {
    const el = btnRefs.current[active];
    if (!el) return;
    setInd({ x: el.offsetLeft, w: el.offsetWidth, ready: true });
    if (navRef.current && navRef.current.scrollWidth > navRef.current.clientWidth) {
      el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    }
  }, [active]);

  useLayoutEffect(() => { measure(); }, [measure]);
  useEffect(() => {
    window.addEventListener('resize', measure);
    const t = setTimeout(measure, 300); // nach dem Laden der Webfonts
    return () => { window.removeEventListener('resize', measure); clearTimeout(t); };
  }, [measure]);

  return (
    <nav className="tab-nav glass-strong" ref={navRef}>
      <div className="tab-indicator" style={{ width: ind.w, transform: `translateX(${ind.x}px)`, opacity: ind.ready ? 1 : 0 }} />
      {tabs.map(t => (
        <button key={t.id} ref={el => { btnRefs.current[t.id] = el; }} className={`tab-btn ${active === t.id ? 'active' : ''}`} onClick={() => onChange(t.id)}>
          <Icon name={t.icon} size={15} /> <span>{t.label}</span>
          {t.pro && <span className="tab-pro">PRO</span>}
        </button>
      ))}
    </nav>
  );
}

function ScreenshotThumb({ id, onOpen, onRemove }) {
  const src = useImage(id);
  return (
    <div className="shot" onClick={() => src && onOpen && onOpen(src)}>
      {src ? <img src={src} alt="Chart-Screenshot" /> : <div className="loading-shell" style={{ minHeight: '100%' }}><div className="loader" /></div>}
      {onRemove && <button type="button" className="shot-remove" onClick={e => { e.stopPropagation(); onRemove(); }} aria-label="Screenshot entfernen"><Icon name="X" size={13} /></button>}
    </div>
  );
}

function Lightbox({ src, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!src) return null;
  return <div className="lightbox" onClick={onClose}><img src={src} alt="Screenshot vergrößert" /></div>;
}

function useEscape(onClose) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
}

function TradeForm({ initial, template, onSave, onClose, currency, strategyTags = STRATEGY_SUGGESTIONS, plan, trades = [], accounts, defaultAccountId, knownTags = [] }) {
  const base = initial || template;
  const [form, setForm] = useState(() => base
    ? {
      ...normalizeTrade(base, defaultAccountId),
      stopLoss: base.stopLoss ?? '', takeProfit: base.takeProfit ?? '',
      fees: base.fees || '', time: base.time || '', exitDate: base.exitDate || '', exitTime: base.exitTime || ''
    }
    : {
      accountId: defaultAccountId, date: todayISO(), symbol: '', direction: 'long', entryPrice: '', exitPrice: '',
      quantity: '', fees: '', strategy: '', notes: '', onPlan: true, setups: [], result: null,
      stopLoss: '', takeProfit: '', time: '', exitDate: '', exitTime: '', emotion: null, rating: 0, tags: [], screenshots: []
    });
  const [shots, setShots] = useState(() => (initial?.screenshots || []).map(id => ({ id, isNew: false })));
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const fileRef = useRef(null);
  const symbolRef = useRef(null);

  useEffect(() => { if (!initial) symbolRef.current?.focus(); }, []);
  useEscape(onClose);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const num = (v) => (v === '' || v == null ? null : Number(v));

  const draft = useMemo(() => ({
    direction: form.direction, entryPrice: num(form.entryPrice), exitPrice: num(form.exitPrice), quantity: num(form.quantity),
    fees: num(form.fees) || 0, stopLoss: num(form.stopLoss), takeProfit: num(form.takeProfit),
    date: form.date, time: form.time, exitDate: form.exitDate, exitTime: form.exitTime
  }), [form]);
  const complete = draft.entryPrice && draft.exitPrice && draft.quantity;
  const preview = complete ? calcPnL(draft) : null;
  const rMultiple = complete ? calcRMultiple(draft) : null;
  const plannedRR = draft.entryPrice ? calcPlannedRR(draft) : null;
  const hold = holdingMinutes(draft);

  const warnings = useMemo(() => {
    const list = [];
    if (!plan) return list;
    const e = draft.entryPrice, sl = draft.stopLoss;
    const target = draft.takeProfit || draft.exitPrice;
    if (e && target && sl) {
      const risk = form.direction === 'long' ? e - sl : sl - e;
      const reward = form.direction === 'long' ? target - e : e - target;
      const minRR = parseMinRiskReward(plan.minRiskReward);
      if (risk <= 0) list.push('Der Stop-Loss liegt auf der falschen Seite deines Einstiegs.');
      else if (minRR != null && reward / risk < minRR) list.push(`Risiko:Reward liegt bei 1:${(reward / risk).toFixed(2)} – unter deinem Plan-Minimum von 1:${minRR}.`);
    }
    const sameDayTrades = trades.filter(t => t.date === form.date && t.id !== initial?.id && t.accountId === form.accountId);
    if (plan.maxTradesPerDay && sameDayTrades.length + 1 > plan.maxTradesPerDay) {
      list.push(`Das wäre Trade Nr. ${sameDayTrades.length + 1} am ${fmtDateShort(form.date)} – dein Tageslimit liegt bei ${plan.maxTradesPerDay}.`);
    }
    const lossSoFar = Math.abs(sameDayTrades.reduce((s, t) => s + Math.min(0, calcPnL(t)), 0));
    if (plan.maxDailyDrawdown && lossSoFar >= plan.maxDailyDrawdown) {
      list.push(`Dein Tagesverlust-Limit von ${fmtMoney(plan.maxDailyDrawdown, currency)} ist an diesem Tag bereits erreicht.`);
    }
    if (['revenge', 'fomo'].includes(form.emotion)) list.push(`Emotion "${EMOTION_BY_KEY[form.emotion].label}" – laut deinen Psychologie-Regeln ein Warnsignal.`);
    return list;
  }, [form, draft, plan, trades, initial, currency]);

  const addFiles = async (files) => {
    const images = [...files].filter(f => f.type.startsWith('image/'));
    for (const f of images) {
      try {
        const dataUrl = await compressImage(f);
        const id = uid('img');
        imageCache.set(id, dataUrl);
        setShots(s => [...s, { id, isNew: true, dataUrl }]);
      } catch (e) { setError('Ein Bild konnte nicht verarbeitet werden.'); }
    }
  };

  const onPaste = (e) => {
    const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); addFiles(files); }
  };

  const submit = async () => {
    if (!form.symbol.trim()) return setError('Bitte ein Symbol angeben.');
    if (!form.entryPrice || !form.exitPrice || !form.quantity) return setError('Einstieg, Ausstieg und Menge sind erforderlich.');
    setError('');
    setSaving(true);
    try {
      for (const s of shots) if (s.isNew) await window.imageStore.set(s.id, s.dataUrl);
      const kept = new Set(shots.map(s => s.id));
      for (const id of initial?.screenshots || []) if (!kept.has(id)) { await window.imageStore.delete(id); imageCache.delete(id); }
    } catch (e) { console.error(e); }
    onSave({
      id: initial?.id || uid(),
      accountId: form.accountId,
      date: form.date,
      time: form.time || '',
      exitDate: form.exitDate && form.exitDate !== form.date ? form.exitDate : '',
      exitTime: form.exitTime || '',
      symbol: form.symbol.trim().toUpperCase(),
      direction: form.direction,
      entryPrice: Number(form.entryPrice),
      exitPrice: Number(form.exitPrice),
      stopLoss: form.stopLoss !== '' ? Number(form.stopLoss) : null,
      takeProfit: form.takeProfit !== '' ? Number(form.takeProfit) : null,
      quantity: Number(form.quantity),
      fees: Number(form.fees) || 0,
      strategy: form.strategy.trim(),
      notes: form.notes.trim(),
      onPlan: !!form.onPlan,
      setups: form.setups,
      result: form.result,
      emotion: form.emotion,
      rating: form.rating,
      tags: form.tags,
      screenshots: shots.map(s => s.id),
      createdAt: initial?.createdAt || Date.now()
    });
  };

  const onKeyDown = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') submit(); };

  return (
    <div className="modal-overlay" onMouseDown={onClose}>
      <div className="modal glass-strong" onMouseDown={e => e.stopPropagation()} onPaste={onPaste} onKeyDown={onKeyDown} role="dialog" aria-label={initial ? 'Trade bearbeiten' : 'Neuer Trade'}>
        <div className="modal-head">
          <h2><Icon name={initial ? 'Pencil' : 'Plus'} size={17} /> {initial ? 'Trade bearbeiten' : 'Neuer Trade'}</h2>
          <button className="icon-btn" onClick={onClose} aria-label="Schließen"><Icon name="X" size={18} /></button>
        </div>

        <div className="modal-body">
          <div className="form-row">
            <label>Symbol
              <input ref={symbolRef} type="text" placeholder="z.B. AAPL" value={form.symbol} onChange={e => set('symbol', e.target.value)} />
            </label>
            {accounts.length > 1 ? (
              <label>Konto
                <select value={form.accountId} onChange={e => set('accountId', e.target.value)}>
                  {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </label>
            ) : (
              <label>Strategie
                <input list="strategy-list" type="text" placeholder="optional" value={form.strategy} onChange={e => set('strategy', e.target.value)} />
              </label>
            )}
          </div>
          {accounts.length > 1 && (
            <label>Strategie
              <input list="strategy-list" type="text" placeholder="optional" value={form.strategy} onChange={e => set('strategy', e.target.value)} />
            </label>
          )}
          <datalist id="strategy-list">{strategyTags.map(s => <option key={s} value={s} />)}</datalist>

          <div className="form-row">
            <label>Richtung
              <div className="seg-control">
                <button type="button" className={form.direction === 'long' ? 'active long' : ''} onClick={() => set('direction', 'long')}>▲ Long</button>
                <button type="button" className={form.direction === 'short' ? 'active short' : ''} onClick={() => set('direction', 'short')}>▼ Short</button>
              </div>
            </label>
            <label>Im Plan?
              <div className="seg-control">
                <button type="button" className={form.onPlan ? 'active long' : ''} onClick={() => set('onPlan', true)}>Ja</button>
                <button type="button" className={!form.onPlan ? 'active short' : ''} onClick={() => set('onPlan', false)}>Nein</button>
              </div>
            </label>
          </div>

          <div className="form-section-title">Preise</div>
          <div className="form-row three">
            <label>Einstieg
              <input type="number" step="any" inputMode="decimal" placeholder="0.00" value={form.entryPrice} onChange={e => set('entryPrice', e.target.value)} />
            </label>
            <label>Ausstieg
              <input type="number" step="any" inputMode="decimal" placeholder="0.00" value={form.exitPrice} onChange={e => set('exitPrice', e.target.value)} />
            </label>
            <label>Menge
              <input type="number" step="any" inputMode="decimal" placeholder="0" value={form.quantity} onChange={e => set('quantity', e.target.value)} />
            </label>
          </div>
          <div className="form-row three">
            <label>Stop-Loss
              <input type="number" step="any" inputMode="decimal" placeholder="optional" value={form.stopLoss} onChange={e => set('stopLoss', e.target.value)} />
            </label>
            <label>Take-Profit
              <input type="number" step="any" inputMode="decimal" placeholder="optional" value={form.takeProfit} onChange={e => set('takeProfit', e.target.value)} />
            </label>
            <label>Gebühren
              <input type="number" step="any" inputMode="decimal" placeholder="0.00" value={form.fees} onChange={e => set('fees', e.target.value)} />
            </label>
          </div>

          <div className="pnl-preview">
            <div><span>Ergebnis</span><strong className={preview == null ? '' : preview >= 0 ? 'txt-profit' : 'txt-loss'}>{preview == null ? '—' : fmtMoneySigned(preview, currency)}</strong></div>
            <div><span>R-Multiple</span><strong className={rMultiple == null ? '' : rMultiple >= 0 ? 'txt-profit' : 'txt-loss'}>{fmtR(rMultiple)}</strong></div>
            <div><span>Geplantes R:R</span><strong>{plannedRR == null ? '—' : `1:${fmtNum(plannedRR, 2)}`}</strong></div>
          </div>

          <div className="form-section-title">Zeit</div>
          <div className="form-row four">
            <label>Einstieg (Datum)
              <input type="date" value={form.date} onChange={e => set('date', e.target.value)} />
            </label>
            <label>Uhrzeit
              <input type="time" value={form.time} onChange={e => set('time', e.target.value)} />
            </label>
            <label>Ausstieg (Datum)

              <input type="time" value={form.exitTime} onChange={e => set('exitTime', e.target.value)} />

          <div className="reflect-section">

            <span className="mindset-label">Ergebnis</span>
            <SingleChipSelect options={RESULT_OPTIONS} selected={form.result} onChange={v => set('result', v)} />
            <span className="mindset-label">Ausführungsqualität</span>
            <StarRating value={form.rating} onChange={v => set('rating', v)} />
          </div>

          <label>Eigene Tags
            <ChipEditor tags={form.tags} onChange={v => set('tags', v)} placeholder={knownTags.length ? `z.B. ${knownTags.slice(0, 3).join(', ')}` : 'z.B. News, Earnings, A+ Setup'} />
          </label>

          <label>Notizen
            <textarea rows={3} placeholder="Setup, Emotionen, Lessons Learned…" value={form.notes} onChange={e => set('notes', e.target.value)} />
          </label>

          <div>
            <span className="mindset-label">Chart-Screenshots</span>
            <div className="shot-grid">
              {shots.map(s => (
                <ScreenshotThumb key={s.id} id={s.id} onOpen={setLightbox} onRemove={() => setShots(list => list.filter(x => x.id !== s.id))} />
              ))}

              </button>
            </div>
            <p className="shot-hint" style={{ marginTop: 8 }}>Tipp: Screenshot kopieren und hier mit <span className="kbd">Strg/⌘ + V</span> einfügen.</p>

          </div>

          {error && <div className="form-error"><Icon name="AlertTriangle" size={14} /> {error}</div>}
        </div>

        <div className="modal-foot">
          <span className="shot-hint left hide-sm"><span className="kbd">⌘/Strg + Enter</span> speichert</span>
          <button className="btn-ghost" onClick={onClose}>Abbrechen</button>
          <button className="btn-primary" onClick={submit} disabled={saving}>{initial ? 'Speichern' : 'Trade hinzufügen'}</button>
        </div>
      </div>
      {lightbox && <Lightbox src={lightbox} onClose={() => setLightbox(null)} />}
    </div>
  );
}

function PriceLadder({ trade }) {
  const pts = [
    { key: 'sl', label: 'SL', v: trade.stopLoss, color: 'var(--loss)' },
    { key: 'entry', label: 'Einstieg', v: trade.entryPrice, color: 'var(--text-muted)' },
    { key: 'tp', label: 'TP', v: trade.takeProfit, color: 'var(--profit)' },
    { key: 'exit', label: 'Ausstieg', v: trade.exitPrice, color: 'var(--accent)' }
  ].filter(p => p.v != null && p.v !== '');
  if (pts.length < 2) return null;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 1;
  lo -= pad; hi += pad;
  const pos = (v) => ((v - lo) / (hi - lo)) * 100;
  const flip = trade.direction === 'short';
  const x = (v) => flip ? 100 - pos(v) : pos(v);
  const e = trade.entryPrice;
  const segs = [];
  if (trade.stopLoss) segs.push({ from: x(trade.stopLoss), to: x(e), color: 'rgba(240,97,109,0.55)' });
  if (trade.takeProfit) segs.push({ from: x(e), to: x(trade.takeProfit), color: 'rgba(63,207,142,0.55)' });
  return (
    <div className="price-ladder">
      <div className="track" />
      {segs.map((s, i) => <div key={i} className="seg" style={{ left: `${Math.min(s.from, s.to)}%`, width: `${Math.abs(s.to - s.from)}%`, background: s.color }} />)}
      {pts.map((p, i) => (
        <div key={p.key} className="mark" style={{ left: `${x(p.v)}%`, color: p.color, top: i % 2 ? 12 : 12 }}>
          <i />
          <b>{p.label}</b>
        </div>
      ))}
    </div>
  );
}

function TradeDetail({ trade, account, currency, onClose, onEdit, onDelete, onDuplicate }) {

  const rr = calcPlannedRR(trade);

  const retPct = (pnl / (trade.entryPrice * trade.quantity)) * 100;

  return (
    <>
      <div className="drawer-overlay" onClick={onClose} />

          <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginTop: 14, flexWrap: 'wrap' }}>
            <div className={`drawer-pnl ${pnl >= 0 ? 'txt-profit' : 'txt-loss'}`}>{fmtMoneySigned(pnl, currency)}</div>
            <span className={`mono ${pnl >= 0 ? 'txt-profit' : 'txt-loss'}`} style={{ fontSize: 13 }}>{fmtPct(retPct, 2)}</span>
            {r != null && <Pill tone={r >= 0 ? 'profit' : 'loss'}>{fmtR(r)}</Pill>}
          </div>
        </div>
        <div className="drawer-body">
          <PriceLadder trade={trade} />
          <div className="kv-grid">
            <div className="kv"><span>Einstieg</span><strong>{trade.entryPrice}</strong></div>
            <div className="kv"><span>Ausstieg</span><strong>{trade.exitPrice}</strong></div>
            <div className="kv"><span>Menge</span><strong>{trade.quantity}</strong></div>
            <div className="kv"><span>Stop-Loss</span><strong>{trade.stopLoss ?? '—'}</strong></div>
            <div className="kv"><span>Take-Profit</span><strong>{trade.takeProfit ?? '—'}</strong></div>
            <div className="kv"><span>Gebühren</span><strong>{fmtMoney(trade.fees || 0, currency)}</strong></div>
            <div className="kv"><span>Risiko</span><strong>{risk != null ? fmtMoney(risk, currency) : '—'}</strong></div>
            <div className="kv"><span>Geplantes R:R</span><strong>{rr != null ? `1:${fmtNum(rr, 2)}` : '—'}</strong></div>
            <div className="kv"><span>Haltedauer</span><strong>{fmtDuration(hold)}</strong></div>

          {trade.rating > 0 && (
            <div><span className="mindset-label">Ausführungsqualität</span><StarRating value={trade.rating} size={18} /></div>

          {(trade.setups?.length > 0 || trade.tags?.length > 0) && (

              <span className="mindset-label">Setups & Tags</span>
              <div className="chip-row">
                {trade.setups.map(s => <span key={s} className="chip toggle active">{s}</span>)}
                {trade.tags.map(s => <span key={s} className="chip toggle"><Icon name="Tag" size={11} /> {s}</span>)}
              </div>
            </div>
          )}

          {trade.notes && (
            <div><span className="mindset-label">Notizen</span><p className="drawer-notes">{trade.notes}</p></div>
          )}

          {trade.screenshots?.length > 0 && (
            <div>
              <span className="mindset-label">Screenshots</span>
              <div className="shot-grid">{trade.screenshots.map(id => <ScreenshotThumb key={id} id={id} onOpen={setLightbox} />)}</div>
            </div>
          )}

          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <button className="btn-primary" onClick={() => onEdit(trade)}><Icon name="Pencil" size={14} /> Bearbeiten</button>
            <button className="btn-ghost" onClick={() => onDuplicate(trade)}><Icon name="Repeat" size={14} /> Duplizieren</button>
            <button className="btn-danger" onClick={() => onDelete(trade.id)} style={{ marginLeft: 'auto' }}><Icon name="Trash2" size={14} /> Löschen</button>
          </div>
        </div>
      </aside>
      {lightbox && <Lightbox src={lightbox} onClose={() => setLightbox(null)} />}
    </>
  );
}

function SyncSection({ sync }) {
  const { cfg, state, onConnect, onDisconnect, onSyncNow } = sync;
  const [token, setToken] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [showHelp, setShowHelp] = useState(false);
  const [confirmOff, setConfirmOff] = useState(false);

  const connect = async () => {
    setBusy(true); setMsg(null);
    try {
      const created = await onConnect(token);
      setMsg({ ok: true, text: created ? 'Verbunden – neues Sync-Gist angelegt. Gib denselben Token auf deinen anderen Geräten ein.' : 'Verbunden – vorhandene Daten gefunden und zusammengeführt.' });
      setToken('');
    } catch (e) { setMsg({ ok: false, text: e.message || String(e) }); }
    setBusy(false);
  };

  const statusText = {
    ok: `Synchronisiert ${fmtAgo(state.at)}`,
    syncing: 'Synchronisiere …',
    idle: 'Verbunden',
    offline: 'Offline – wird nachgeholt',
    error: `Fehler: ${state.error}`
  }[state.state];

  return (
    <div className="settings-section">
      <span className="mindset-label">Geräte-Sync</span>
      {cfg?.enabled ? (
        <>
          <div className="sync-status">
            <span className={`sync-dot s-${state.state}`} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <strong>{statusText}</strong>
              <p>Alle Geräte mit diesem Token teilen denselben Stand: Trades, Konten, Plan, Mindset und Screenshots.</p>
            </div>
            <button className="btn-ghost" onClick={onSyncNow} disabled={state.state === 'syncing'}><Icon name="RefreshCw" size={14} className={state.state === 'syncing' ? 'spin' : ''} /> Jetzt</button>
          </div>
          {!confirmOff ? (
            <button className="btn-ghost" style={{ alignSelf: 'flex-start' }} onClick={() => setConfirmOff(true)}><Icon name="CloudOff" size={14} /> Sync auf diesem Gerät trennen</button>
          ) : (
            <div className="danger-zone confirming">
              <div><strong>Sync trennen?</strong><p>Die Daten bleiben auf diesem Gerät und im Gist erhalten – nur der Abgleich stoppt und der Token wird hier gelöscht.</p></div>
              <div className="danger-confirm-actions">
                <button className="btn-ghost" onClick={() => setConfirmOff(false)}>Abbrechen</button>
                <button className="btn-danger" onClick={() => { onDisconnect(); setConfirmOff(false); }}>Trennen</button>
              </div>
            </div>
          )}
        </>
      ) : (
        <>
          <p className="shot-hint">Nutze TradeTracer auf PC, Handy und Tablet mit demselben Stand. Die Daten liegen in einem geheimen Gist in deinem GitHub-Konto – kein fremder Server.</p>
          <div className="chip-add">
            <input type="password" autoComplete="off" placeholder="GitHub-Token (ghp_… oder github_pat_…)" value={token} onChange={e => setToken(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') connect(); }} />
            <button className="btn-primary" onClick={connect} disabled={busy || !token.trim()}>{busy ? 'Verbinde …' : 'Verbinden'}</button>
          </div>
          <button type="button" className="btn-ghost" style={{ alignSelf: 'flex-start' }} onClick={() => setShowHelp(h => !h)}>
            <Icon name={showHelp ? 'ChevronUp' : 'ChevronDown'} size={14} /> So bekommst du einen Token
          </button>
          {showHelp && (
            <ol className="report-list" style={{ margin: 0 }}>
              <li>Öffne <a href="https://github.com/settings/tokens/new?scopes=gist&description=TradeTracer%20Sync" target="_blank" rel="noopener" className="txt-accent">github.com/settings/tokens/new</a> (Token classic).</li>
              <li>Nur das Häkchen <b>gist</b> setzen, Ablaufdatum nach Wunsch (z.B. „No expiration“).</li>
              <li>„Generate token“ klicken, Token kopieren und hier einfügen.</li>
              <li>Auf jedem weiteren Gerät denselben Token eingeben – die App findet deine Daten automatisch.</li>
            </ol>
          )}
        </>
      )}
      {msg && <p className="backup-msg" style={msg.ok ? undefined : { color: 'var(--loss)' }}>{msg.text}</p>}
    </div>
  );
}

function SettingsModal({ settings, accounts, trades, onSave, onClose, onReset, onExport, onImport, sync }) {
  const [local, setLocal] = useState(settings);
  const [accs, setAccs] = useState(accounts);
  const [confirmReset, setConfirmReset] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [importMsg, setImportMsg] = useState('');
  const fileInputRef = useRef(null);
  useEscape(onClose);

  const countFor = (id) => trades.filter(t => t.accountId === id).length;
  const updateAcc = (id, patch) => setAccs(list => list.map(a => a.id === id ? { ...a, ...patch } : a));
  const addAcc = () => setAccs(list => [...list, { id: uid('acc'), name: `Konto ${list.length + 1}`, startingBalance: 10000, hue: ACCOUNT_HUES[list.length % ACCOUNT_HUES.length] }]);
  const removeAcc = (id) => { setAccs(list => list.filter(a => a.id !== id)); setConfirmDelete(null); };

  const handleFileChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        await onImport(data);
        setImportMsg('Backup erfolgreich importiert.');
      } catch (err) {
        setImportMsg('Datei konnte nicht gelesen werden – bitte eine gültige Backup-Datei wählen.');
      }

    reader.readAsText(file);
    e.target.value = '';

  return (
    <div className="modal-overlay" onMouseDown={onClose}>
      <div className="modal glass-strong" onMouseDown={e => e.stopPropagation()} role="dialog" aria-label="Einstellungen">

          <h2><Icon name="Settings" size={17} /> Einstellungen</h2>

        </div>
        <div className="modal-body">
          <SyncSection sync={sync} />

            <span className="mindset-label">Konten & Portfolios</span>
            {accs.map(a => (
              <div key={a.id}>
                <div className="acc-row">
                  <button type="button" className="acc-color" style={{ background: `hsl(${a.hue} 70% 60%)` }} title="Farbe wechseln"
                    onClick={() => updateAcc(a.id, { hue: ACCOUNT_HUES[(ACCOUNT_HUES.indexOf(a.hue) + 1) % ACCOUNT_HUES.length] })} />
                  <input value={a.name} onChange={e => updateAcc(a.id, { name: e.target.value })} aria-label="Kontoname" />
                  <input type="number" value={a.startingBalance} onChange={e => updateAcc(a.id, { startingBalance: Number(e.target.value) })} aria-label="Startkapital" title="Startkapital" />
                  <button className="icon-btn danger" disabled={accs.length <= 1} onClick={() => setConfirmDelete(a.id)} aria-label="Konto löschen" style={accs.length <= 1 ? { opacity: .35, cursor: 'not-allowed' } : undefined}><Icon name="Trash2" size={14} /></button>
                </div>
                {confirmDelete === a.id && (
                  <div className="danger-zone confirming" style={{ marginTop: 8 }}>
                    <div><strong>„{a.name}" löschen?</strong><p>{countFor(a.id)} zugehörige Trades werden beim Speichern ebenfalls gelöscht.</p></div>
                    <div className="danger-confirm-actions">
                      <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>Abbrechen</button>
                      <button className="btn-danger" onClick={() => removeAcc(a.id)}>Konto entfernen</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
            <button className="btn-ghost" style={{ alignSelf: 'flex-start' }} onClick={addAcc}><Icon name="Plus" size={14} /> Konto hinzufügen</button>
          </div>

          <div className="settings-section">
            <span className="mindset-label">Darstellung</span>
            <label>Währungssymbol
              <input type="text" maxLength={3} value={local.currency} onChange={e => setLocal(s => ({ ...s, currency: e.target.value }))} />
            </label>
            <div className="hue-field">
              <div className="hue-field-head">
                <span>Akzentfarbe</span>
                <span className="hue-swatch" style={{ background: `hsl(${local.accentHue} 72% 60%)` }} />
              </div>
              <input type="range" min={0} max={360} value={local.accentHue} className="hue-slider"
                onChange={e => setLocal(s => ({ ...s, accentHue: Number(e.target.value) }))} />
              <div className="hue-presets">
                {[38, 0, 25, 150, 190, 220, 265, 320].map(h => (
                  <button key={h} type="button" className={`hue-preset ${local.accentHue === h ? 'active' : ''}`}
                    style={{ background: `hsl(${h} 72% 60%)` }} onClick={() => setLocal(s => ({ ...s, accentHue: h }))} aria-label={`Farbton ${h}`} />
                ))}

            </div>
            <div className="settings-row">
              <div><strong>Animierter Hintergrund</strong><p>Shader-Gradient in Bewegung. Aus = spart Akku.</p></div>

            <div className="settings-row">
              <div><strong>Privatsphäre-Modus</strong><p>Blendet alle Geldbeträge aus – ideal für Screenshots. Taste <span className="kbd">P</span></p></div>

            </div>

          <div className="settings-section">
            <span className="mindset-label">Backup</span>

              <span><span className="kbd">N</span> Neuer Trade</span>
              <span><span className="kbd">1–7</span> Tabs</span>
              <span><span className="kbd">P</span> Privatsphäre</span>
              <span><span className="kbd">Esc</span> Schließen</span>
            </div>
          </div>

          <div className={`danger-zone ${confirmReset ? 'confirming' : ''}`}>
            {!confirmReset ? (
              <>
                <div><strong>Alle Trades löschen</strong><p>Entfernt sämtliche Trades und Screenshots unwiderruflich.</p></div>
                <button className="btn-danger" onClick={() => setConfirmReset(true)}><Icon name="Trash2" size={14} /> Zurücksetzen</button>
              </>
            ) : (
              <>
                <div>
                  <strong>Wirklich alles löschen?</strong>
                  <p>{trades.length > 0 ? `${trades.length} Trade${trades.length === 1 ? '' : 's'} werden` : 'Alle Daten werden'} unwiderruflich entfernt. Das kann nicht rückgängig gemacht werden.</p>
                </div>
                <div className="danger-confirm-actions">
                  <button className="btn-ghost" onClick={() => setConfirmReset(false)}>Abbrechen</button>
                  <button className="btn-danger" onClick={onReset}><Icon name="Trash2" size={14} /> Endgültig löschen</button>
                </div>
              </>
            )}
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn-ghost" onClick={onClose}>Abbrechen</button>

function MindsetCard({ entry, onChange, streak }) {
  const [session, setSession] = useState(() => new Date().getHours() >= 15 ? 'post' : 'pre');
  const e = entry || defaultMindsetEntry();

  const updatePre = (patch) => onChange({ ...e, pre: { ...e.pre, ...patch } });
  const updatePost = (patch) => onChange({ ...e, post: { ...e.post, ...patch } });
  const toggleChip = (list, value) => list.includes(value) ? list.filter(v => v !== value) : [...list, value];
  const toggleChecklist = (idx) => {
    const next = [...e.pre.checklist];
    next[idx] = !next[idx];
    updatePre({ checklist: next });
  };
  const checkedCount = e.pre.checklist.filter(Boolean).length;

  return (
    <div className="panel mindset-card">
      <div className="mindset-head">
        <div className="mindset-title">
          <span className="plan-icon tone-pink"><Icon name="Brain" size={16} /></span>
          <h3>Mindset-Check-in</h3>
          {streak > 0 && <span className="streak-pill"><Icon name="Flame" size={12} /> {streak} {streak === 1 ? 'Tag' : 'Tage'}</span>}
        </div>
        <div className="seg-control mini">
          <button type="button" className={session === 'pre' ? 'active' : ''} onClick={() => setSession('pre')}>Vor der Session{e.pre.done ? ' ✓' : ''}</button>
          <button type="button" className={session === 'post' ? 'active' : ''} onClick={() => setSession('post')}>Danach{e.post.done ? ' ✓' : ''}</button>
        </div>
      </div>

      {session === 'pre' && (
        e.pre.done ? (
          <div className="mindset-summary">
            <span>{PRE_MOODS.find(m => m.key === e.pre.mood)?.emoji || '—'} {PRE_MOODS.find(m => m.key === e.pre.mood)?.label || 'Keine Angabe'}</span>
            <span className="dot">·</span>
            <span>{checkedCount}/{PRE_CHECKLIST.length} erledigt</span>
            <button className="btn-ghost" onClick={() => updatePre({ done: false })}><Icon name="Pencil" size={13} /> Bearbeiten</button>
          </div>
        ) : (
          <>
            <p className="mindset-question">Wie fühlst du dich heute?</p>
            <div className="mood-row">
              {PRE_MOODS.map(m => (
                <button key={m.key} type="button" className={`mood-btn ${e.pre.mood === m.key ? 'active' : ''}`} onClick={() => updatePre({ mood: m.key })}>
                  <span className="mood-emoji">{m.emoji}</span><span>{m.label}</span>
                </button>
              ))}
            </div>
            <div className="mindset-block">
              <span className="mindset-label">Pre-Market-Checkliste</span>
              <div className="mindset-checklist">
                {PRE_CHECKLIST.map((item, i) => (
                  <button key={i} type="button" className={`checklist-item ${e.pre.checklist[i] ? 'checked' : ''}`} onClick={() => toggleChecklist(i)}>
                    <span className="checklist-dot">{e.pre.checklist[i] && <Icon name="Check" size={11} strokeWidth={3} />}</span>
                    {item}
                  </button>
                ))}
              </div>
            </div>
            <textarea rows={2} placeholder="Wie schätzt du den heutigen Markt ein?" value={e.pre.note} onChange={ev => updatePre({ note: ev.target.value })} />
            <button className="btn-primary" style={{ alignSelf: 'flex-start' }} onClick={() => updatePre({ done: true })}><Icon name="Check" size={14} /> Fertig</button>
          </>
        )
      )}

      {session === 'post' && (
        e.post.done ? (
          <div className="mindset-summary">
            <span>{DAY_RATINGS.find(r => r.key === e.post.rating)?.label || 'Keine Bewertung'}</span>
            <span className="dot">·</span>
            <span>{e.post.worked.length} positiv · {e.post.improve.length} zu verbessern</span>
            <button className="btn-ghost" onClick={() => updatePost({ done: false })}><Icon name="Pencil" size={13} /> Bearbeiten</button>
          </div>
        ) : (
          <>
            <p className="mindset-question">Wie lief der Tag?</p>
            <div className="rating-row">
              {DAY_RATINGS.map(r => (
                <button key={r.key} type="button" className={`rating-btn tone-${r.key} ${e.post.rating === r.key ? 'active' : ''}`} onClick={() => updatePost({ rating: r.key })}>
                  <Icon name={r.icon} size={20} /><span>{r.label}</span>
                </button>
              ))}
            </div>
            <div className="mindset-block">
              <span className="mindset-label">Was hat funktioniert</span>
              <div className="chip-row">
                {WORKED_OPTIONS.map(o => (
                  <button key={o} type="button" className={`chip toggle good ${e.post.worked.includes(o) ? 'active' : ''}`} onClick={() => updatePost({ worked: toggleChip(e.post.worked, o) })}>{o}</button>
                ))}
              </div>
            </div>
            <div className="mindset-block">
              <span className="mindset-label">Was verbessert werden sollte</span>
              <div className="chip-row">
                {IMPROVE_OPTIONS.map(o => (
                  <button key={o} type="button" className={`chip toggle warn ${e.post.improve.includes(o) ? 'active' : ''}`} onClick={() => updatePost({ improve: toggleChip(e.post.improve, o) })}>{o}</button>
                ))}

            <button className="btn-primary" style={{ alignSelf: 'flex-start' }} onClick={() => updatePost({ done: true })}><Icon name="Check" size={14} /> Fertig</button>
          </>
        )
      )}

  );

function ImportModal({ onClose, onImport, accounts, defaultAccountId }) {
  const [step, setStep] = useState('upload');
  const [fileName, setFileName] = useState('');
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [parseError, setParseError] = useState('');
  const [result, setResult] = useState(null);
  const [accountId, setAccountId] = useState(defaultAccountId);
  const fileInputRef = useRef(null);
  useEscape(onClose);

  const downloadTemplate = () => {
    const header = ['Datum', 'Symbol', 'Richtung', 'Einstieg', 'Ausstieg', 'Menge', 'Gebühren', 'Stop-Loss', 'Take-Profit', 'Strategie', 'Einstiegszeit', 'Ausstiegszeit', 'Notizen'];
    const example = ['2026-07-21', 'AAPL', 'long', 150, 155, 10, 1, 148, 156, 'Breakout', '09:35', '10:20', 'Beispiel-Trade'];
    const ws = XLSX.utils.aoa_to_sheet([header, example]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Trades');
    XLSX.writeFile(wb, 'trade-import-vorlage.xlsx');
  };

  const handleFile = (file) => {
    setParseError('');
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array', cellDates: true });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
        if (aoa.length < 2) { setParseError('Die Datei enthält keine auswertbaren Zeilen.'); return; }
        const headerRow = aoa[0].map(h => String(h ?? '').trim());
        const dataRows = aoa.slice(1).filter(r => r.some(c => c !== '' && c != null));
        if (dataRows.length === 0) { setParseError('Es wurden keine Datenzeilen gefunden.'); return; }
        setHeaders(headerRow);
        setRows(dataRows);
        setMapping(guessImportMapping(headerRow));
        setStep('map');
      } catch (err) {
        setParseError('Die Datei konnte nicht gelesen werden. Bitte eine gültige Excel- (.xlsx) oder CSV-Datei wählen.');
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const requiredMissing = IMPORT_FIELDS.filter(f => f.required && !(mapping[f.key] >= 0));

  const runImport = () => {
    const { trades, errors } = buildTradesFromImportRows(rows, mapping, accountId);
    if (trades.length > 0) onImport(trades);
    setResult({ imported: trades.length, skipped: errors.length, errors: errors.slice(0, 8) });
    setStep('done');
  };

  return (
    <div className="modal-overlay" onMouseDown={onClose}>
      <div className="modal glass-strong" onMouseDown={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2><Icon name="FileSpreadsheet" size={17} /> Trades aus Excel importieren</h2>
          <button className="icon-btn" onClick={onClose} aria-label="Schließen"><Icon name="X" size={18} /></button>
        </div>

        <div className="modal-body">
          {step === 'upload' && (
            <>
              <div className="import-dropzone" onDragOver={e => e.preventDefault()}
                onDrop={e => { e.preventDefault(); const f = e.dataTransfer.files?.[0]; if (f) handleFile(f); }}
                onClick={() => fileInputRef.current?.click()}>
                <Icon name="FileSpreadsheet" size={30} strokeWidth={1.4} />
                <p><strong>Datei auswählen</strong> oder hierher ziehen</p>
                <span>.xlsx, .xls oder .csv – z.B. Broker-Export</span>
                <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: 'none' }}
                  onChange={e => { const f = e.target.files?.[0]; if (f) handleFile(f); e.target.value = ''; }} />
              </div>
              {parseError && <div className="form-error"><Icon name="AlertTriangle" size={14} /> {parseError}</div>}
              <button className="btn-ghost" style={{ alignSelf: 'flex-start' }} onClick={downloadTemplate}><Icon name="Download" size={14} /> Vorlage herunterladen</button>
            </>
          )}

          {step === 'map' && (
            <>
              <p className="import-summary"><strong>{fileName}</strong> · {rows.length} Zeile{rows.length === 1 ? '' : 'n'} gefunden. Ordne die Spalten den Feldern zu:</p>
              {accounts.length > 1 && (
                <label>Importieren in Konto
                  <select value={accountId} onChange={e => setAccountId(e.target.value)}>
                    {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                  </select>
                </label>
              )}
              <div className="import-mapping-grid">
                {IMPORT_FIELDS.map(f => (
                  <label key={f.key}>
                    <span>{f.label}{f.required && <span className="label-optional"> *</span>}</span>
                    <select value={mapping[f.key] ?? -1} onChange={e => setMapping(m => ({ ...m, [f.key]: Number(e.target.value) }))}>
                      <option value={-1}>— nicht zuordnen —</option>
                      {headers.map((h, idx) => <option key={idx} value={idx}>{h || `Spalte ${idx + 1}`}</option>)}
                    </select>
                  </label>
                ))}
              </div>
              {requiredMissing.length > 0 && (
                <div className="form-warning-box">
                  <div className="form-warning-item"><Icon name="AlertTriangle" size={13} /> Bitte noch zuordnen: {requiredMissing.map(f => f.label).join(', ')}</div>
                </div>
              )}
              <div className="import-preview">
                <span className="mindset-label">Vorschau (erste {Math.min(5, rows.length)} Zeilen)</span>
                <table className="trade-table compact">
                  <thead><tr>{IMPORT_FIELDS.filter(f => mapping[f.key] >= 0).map(f => <th key={f.key}>{f.label}</th>)}</tr></thead>
                  <tbody>
                    {rows.slice(0, 5).map((row, i) => (
                      <tr key={i}>{IMPORT_FIELDS.filter(f => mapping[f.key] >= 0).map(f => <td key={f.key} className="muted">{String(row[mapping[f.key]] ?? '')}</td>)}</tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}

          {step === 'done' && result && (
            <div className="import-result">
              <div className="import-result-icon"><Icon name="Check" size={22} /></div>
              <h3>{result.imported} Trade{result.imported === 1 ? '' : 's'} importiert</h3>
              {result.skipped > 0 && <p>{result.skipped} Zeile{result.skipped === 1 ? '' : 'n'} übersprungen.</p>}
              {result.errors.length > 0 && (
                <div className="rule-list">
                  {result.errors.map((e, i) => <div key={i} className="rule-item"><span className="rule-dot" /><span className="rule-text">{e}</span></div>)}
                </div>
              )}
            </div>
          )}
        </div>

        <div className="modal-foot">
          {step === 'upload' && <button className="btn-ghost" onClick={onClose}>Abbrechen</button>}
          {step === 'map' && (
            <>
              <button className="btn-ghost" onClick={() => setStep('upload')}><Icon name="ArrowLeft" size={14} /> Zurück</button>
              <button className="btn-primary" disabled={requiredMissing.length > 0} onClick={runImport}>
                {rows.length} Trade{rows.length === 1 ? '' : 's'} importieren <Icon name="ArrowRight" size={14} />
              </button>
            </>
          )}
          {step === 'done' && <button className="btn-primary" onClick={onClose}>Fertig</button>}
        </div>
      </div>
    </div>
  );
}
